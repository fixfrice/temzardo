[project]
name = "trainiq-ml"
version = "0.1.0"
description = "Personalised workout forecasting service for TrainIQ"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["trainiq_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
