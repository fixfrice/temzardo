name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: trainiq, POSTGRES_PASSWORD: trainiq, POSTGRES_DB: trainiq_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://trainiq:trainiq@localhost:5432/trainiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @trainiq/backend typecheck
      - run: yarn migrate
      - run: yarn workspace @trainiq/backend test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @trainiq/frontend build
